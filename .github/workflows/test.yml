name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call: # build.yml runs this first

permissions:
  contents: read

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings

      # The built binary end to end: CLI, the JSON the widgets decode, and the daemon (unix).
      - run: cargo build
      - run: python scripts/smoke_test.py target/debug/miti

      - run: python -m py_compile scripts/gen_months.py

  widget-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: dotnet build widgets/windows/MitiTray -c Release --nologo

  widget-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release --package-path widgets/macos/MitiBar

  # No Plasma or GNOME Shell on the runner: these catch syntax errors and a broken manifest only.
  widget-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
      - name: KDE plasmoid
        run: |
          python3 -m json.tool widgets/plasmoid/metadata.json >/dev/null
          # org.kde.* modules are not installed here, so skip import and unqualified-id checks.
          /usr/lib/qt6/bin/qmllint --import disable --unqualified disable widgets/plasmoid/contents/ui/main.qml
      - name: GNOME extension
        run: |
          python3 -m json.tool widgets/gnome/metadata.json >/dev/null
          cp widgets/gnome/extension.js "$RUNNER_TEMP/extension.mjs" # ES module syntax
          node --check "$RUNNER_TEMP/extension.mjs"

  # Compile-only: opening a window needs a display.
  gui:
    name: gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - run: cargo clippy -p miti-gui -- -D warnings
      - run: cargo build -p miti-gui
